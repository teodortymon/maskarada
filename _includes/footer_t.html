  <!-- Znajdź nas w sieci: Instagram + Facebook -->
  <style>
    /* Let the FB plugin adapt to the full card width. Facebook caps the
       plugin at 500px, so the card hugs that limit and centers on desktop
       instead of stretching across the page with empty wings. */
    .fb-card,
    .ig-card {
      max-width: 534px; /* 500px plugin + card-body padding + border */
      margin-left: auto;
      margin-right: auto;
    }

    .fb-card .fb-page,
    .fb-card .fb-page span {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    /* Instagram profile card — a cream card matching the Facebook one, laid out
       as a slim single-row banner: gradient avatar ring + handle on the left,
       follow button pushed to the right. No feed widget (Meta retired the
       profile plugin) and no third-party scripts, so it sits in the site
       palette while staying compact. */
    .ig-card .card-body {
      display: flex;
      flex-direction: row;
      align-items: center;
      text-align: left;
      gap: 14px;
      padding: 14px 20px;
      color: #380200;
    }

    .ig-avatar-ring {
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .ig-avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #faf3f3;
      background: #faf3f3;
      display: block;
    }

    /* Handle + button share a row and fill the space between avatar and edge. */
    .ig-info {
      display: flex;
      flex: 1;
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }

    .ig-username {
      font-family: YoungSerif, serif;
      font-size: 1.2rem;
      margin: 0;
      color: #380200;
    }

    .ig-username a {
      color: inherit;
      text-decoration: none;
    }

    .ig-username a:hover,
    .ig-username a:focus {
      color: #f3015e;
      text-decoration: underline;
    }

    .ig-follow-btn {
      display: inline-block;
      margin-left: auto;
      background: linear-gradient(45deg, #f09433 0%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #fff;
      font-family: YoungSerif, serif;
      font-size: 0.92rem;
      text-decoration: none;
      padding: 8px 20px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(220, 39, 67, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .ig-follow-btn:hover,
    .ig-follow-btn:focus {
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.45);
    }

    /* On very narrow phones the strip wraps and re-centers instead of
       squeezing the handle against the button. */
    @media (max-width: 400px) {
      .ig-card .card-body,
      .ig-info {
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
      }
      .ig-follow-btn {
        margin-left: 0;
      }
    }

  </style>

            <div class="ig-info">

              <a class="ig-follow-btn"
                 href="https://www.instagram.com/teatr.maskarada/"
                 target="_blank"
                 rel="noopener">Obserwuj</a>
            </div>
