    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async font CSS (defer off the critical path; onload flips it live). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'" />

         .ratio) — also declares the self-hosted YoungSerif @font-face. -->
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- Hand-written rental skin (the sky/paper grammar + the 5 identities). -->
    <link rel="stylesheet" href="{{ 'lay/style.css' | bust_file_cache }}" type="text/css" />
  </head>

    </header>
    <script>
      // Auto-hiding site header: hide on scroll down, reveal on scroll up.
      // Maintains --hdr-h (visible header height) for any sticky elements below.
      (function () {
        var hdr = document.querySelector(".site-header");
        if (!hdr) return;
        var hdrHidden = false;
        function setHdrVar() {
          var h = hdrHidden ? 0 : hdr.getBoundingClientRect().height;
          document.documentElement.style.setProperty("--hdr-h", h + "px");
        }
        setHdrVar();
        var lastY = window.scrollY || 0;
        window.addEventListener("scroll", function () {
          var y = window.scrollY || 0;
          if (y > lastY + 6 && y > 180 && !hdrHidden) {
            hdrHidden = true;
            hdr.classList.add("hdr-hide");
            setHdrVar();
          } else if ((y < lastY - 6 || y < 120) && hdrHidden) {
            hdrHidden = false;
            hdr.classList.remove("hdr-hide");
            setHdrVar();
          }
          lastY = y;
        }, { passive: true });
        window.addEventListener("resize", setHdrVar, { passive: true });
      })();
    </script>
