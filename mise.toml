[env]
# CI decrypt recipient (public key of the dedicated CI age key — not secret).
# The private half is stored as the GitHub Actions secret MISE_AGE_KEY; CI uses it
# to decrypt the two BILETOMAT_* values below. On password rotation, re-encrypt with:
#   mise set --age-encrypt --prompt --age-key-file ~/.config/mise/age.txt \
#     --age-recipient age1qhrx4ejxhrl9vek05qw3lp47vt4c7e8mcg9w4z8a56wed5ygcptspuwjf BILETOMAT_USER
# CI recipient: age1qhrx4ejxhrl9vek05qw3lp47vt4c7e8mcg9w4z8a56wed5ygcptspuwjf
BILETOMAT_USER = { age = "" }
BILETOMAT_PASS = { age = "" }
# Organizer whose events are fetched from Biletomat (see tasks.fetch-events).
BILETOMAT_ORGANIZER_ID = "333"

# ---------------------------------------------------------------------------
# Tasks (migrated from Makefile). The Makefile is kept until these are verified.
# ---------------------------------------------------------------------------

[tools]
uv = "latest"

[tasks.dev]
description = "Run Jekyll dev server with livereload"
shell = "fish -lc"
run = "chruby ruby-3.1.3; bundle exec jekyll serve --livereload --host 0.0.0.0"

[tasks.dev-tina]
description = "Run Jekyll dev server with TinaCMS"
run = 'npx tinacms dev -c "bundle exec jekyll serve --livereload --host localhost"'

[tasks.resize-logo]
description = "Resize a logo image to web size (usage: mise run resize-logo -- path/to/logo.png)"
run = "mogrify -resize 600x600"

[tasks.fetch-events]
description = "Log into Biletomat and capture the organizer's events list as JSON (uses BILETOMAT_USER/PASS)"
depends = ["install-browser"]
run = "uv run scripts/fetch_biletomat_events.py"

[tasks.update-links]
description = "Fetch latest Biletomat events, then update ticket links in spektakle YAML"
depends = ["fetch-events"]
run = "python3 scripts/update_spektakle_links.py"
