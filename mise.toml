# Mise task runner — the source of truth for build/run/serve commands.
# See CLAUDE.md: every serving/build command goes through `mise run <task>`,
# and any new working command must be added back here as a task.

[tools]
# Node 20 (>= 20.19) satisfies Eleventy's deps and TinaCMS's better-sqlite3.
node = "20"
# uv runs the Biletomat fetch script (PEP-723 inline deps → Playwright).
uv = "latest"

[settings]
# Local decrypt identity for the BILETOMAT_* values below (not a default name mise
# tries). Absent on CI, which decrypts via MISE_AGE_KEY first — harmless there.
age.ssh_identity_files = ["~/.ssh/personal_github"]

[env]
# Loads gitignored env (e.g. CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID for
# wrangler) if a .env is present; wrangler otherwise falls back to OAuth login.
_.file = ".env"

# Biletomat credentials for the fetch script (see tasks.fetch-events). Values are
# age-encrypted inline to TWO recipients: ~/.ssh/personal_github (local decrypt) and
# the CI age key (private half = MISE_AGE_KEY secret of the "Update Biletomat ticket
# links" GitHub Action). Always (re-)set them via `mise run biletomat-secrets` so
# neither recipient gets dropped.
BILETOMAT_USER = { age = "" }
BILETOMAT_PASS = { age = "" }
# Organizer whose events are fetched from Biletomat (see tasks.fetch-events).
BILETOMAT_ORGANIZER_ID = "333"

[tasks.deps]
description = "Install npm dependencies (auto-runs before dev/build; skipped when node_modules is already up to date)"
run = "npm install"
# Change detection: mise skips this task unless package.json / package-lock.json
# are newer than npm's install marker. Keeps node_modules in sync with
# package.json so a newly-added dep (e.g. onchange) can't go missing.
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.css]
description = "Compile Bootstrap SCSS (scss/) into css/styles.css"
depends = ["deps"]
run = "npm run css"

[tasks.tina-build]
description = "Build the real TinaCMS admin SPA into admin/ (index.html + assets/) so /admin works in production. Needs TINA_PUBLIC_CLIENT_ID + TINA_TOKEN (Tina Cloud). The deploy workflow runs this before `build`; a plain `build` ships the admin only when this bundle is present."
depends = ["deps"]
run = "npx tinacms build"

[tasks.build]
description = "Build the static site into _site/ (SCSS + modal-only Bootstrap JS + Eleventy, then PurgeCSS trims _site/css/styles.css to used selectors)"
depends = ["deps"]
run = "npm run build"

[tasks.js-modal]
description = "Rebuild t/js/bootstrap-modal.min.js (esbuild bundle of Bootstrap's Modal plugin only; committed artifact, also refreshed by build)"
depends = ["deps"]
run = "npm run js-modal"

[tasks.css-purge]
description = "Run PurgeCSS over the built _site/css/styles.css (prod-only trim; config + JS-toggled-class safelist in purgecss.config.js). Needs a prior build."
depends = ["deps"]
run = "npm run css-purge"

# `dev` and `dev-stop` are file tasks under `mise-tasks/` (multi-line logic):
# `dev` records a worktree-local .dev-server.pid so `dev-stop` can stop only THIS
# worktree's server instead of every worktree's via a broad `pkill`.

[tasks.dev-pinned]
description = "Like dev but on a pinned port (default 8790; override: PORT=8791 mise run dev-pinned) — avoids 808x port races when several worktree sessions serve at once"
depends = ["deps"]
run = 'npm run css && npx npm-run-all --parallel watch "serve -- --port=${PORT:-8790}"'

[tasks.format]
description = "Reformat HTML/Liquid templates (_layouts, _includes, index.html) with Prettier"
depends = ["deps"]
run = "npm run format"

[tasks.format-check]
description = "Check HTML/Liquid template formatting without writing (CI-friendly)"
depends = ["deps"]
run = "npm run format:check"

[tasks.dev-tina]
description = "Serve Eleventy behind the TinaCMS dev server (content editing UI)"
depends = ["deps"]
run = "npx tinacms dev -c 'npx @11ty/eleventy --serve'"

[tasks.cf-pages-deploy]
description = "Deploy the built _site/ to the Cloudflare Pages beta (build first)"
run = "npx --yes wrangler pages deploy _site --project-name=maskarada-new-design"

[tasks.preview]
description = "Serve the built _site/ locally with Cloudflare Pages emulation (applies _headers/CSP — unlike `dev`; build first)"
run = "npx --yes wrangler pages dev _site --port 8788 --compatibility-date=2026-05-03"

[tasks.biletomat-secrets]
description = "Set/rotate BILETOMAT_USER/PASS (prompts) — age-encrypted to ~/.ssh/personal_github + the CI key"
# raw: give the task the terminal's stdin/TTY, otherwise --prompt reads EOF and
# silently stores empty values.
raw = true
run = """
[ -t 0 ] || { echo "biletomat-secrets: needs an interactive terminal (no TTY on stdin)" >&2; exit 1; }
# Public half of the MISE_AGE_KEY GitHub secret (not secret). If you replace that
# secret with a new key, update this recipient and re-run this task.
CI_RECIPIENT=age1swtgrepsrwv37exj0klwf7rczjlg7kr59akputps9l0wvuya35tse0rqq8
for var in BILETOMAT_USER BILETOMAT_PASS; do
  mise set --age-encrypt --prompt --age-recipient "$CI_RECIPIENT" \
    --age-ssh-recipient ~/.ssh/personal_github.pub "$var"
done
"""

[tasks.install-browser]
description = "Install the Playwright Chromium browser used by the Biletomat fetch"
run = "uv run --with playwright playwright install chromium --with-deps"

[tasks.fetch-events]
description = "Log into Biletomat and capture the organizer's events as _data/spektakle/new_events.json (uses BILETOMAT_USER/PASS)"
depends = ["install-browser"]
run = "uv run scripts/fetch_biletomat_events.py"

[tasks.update-links]
description = "Fetch latest Biletomat events, then update ticket links in spektakle YAML"
depends = ["fetch-events"]
run = "python3 scripts/update_spektakle_links.py"

[tasks.resize-logo]
description = "Resize a logo image to web size (usage: mise run resize-logo -- path/to/logo.png)"
run = "mogrify -resize 600x600"
