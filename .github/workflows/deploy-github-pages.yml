# Production deploy — Eleventy static site to GitHub Pages.
#
# Replaces the old Jekyll pipeline (jeykyll-gh-pages.yml, removed in the v2
# merge). Builds the Eleventy site with the same command we use locally
# (`npm run build` == SCSS + modal JS + Eleventy + PurgeCSS -> ./_site) and
# publishes it to GitHub Pages. The custom domain (www.maskarada.waw.pl) is
# carried in ./CNAME, which Eleventy passes through into _site/.
#
# Tina is git-backed for CONTENT, but its /admin editing UI is a compiled SPA:
# `npx tinacms build` (mise run tina-build) generates admin/ (index.html +
# assets/) wired to Tina Cloud, and Eleventy passes admin/ through into
# _site/admin. Skip this step and /admin 404s in production (the committed
# admin/index.html is only the localhost:4001 dev shell). Needs the
# TINA_PUBLIC_CLIENT_ID / TINA_TOKEN repo secrets (same as the old Jekyll build).
#
# NOTE: _site/_headers is a Cloudflare Pages file and is ignored by GitHub
# Pages; CSP headers are not applied when hosting on Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One production deploy at a time; never cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The Tina build reads TINA_PUBLIC_CLIENT_ID / TINA_TOKEN, which are stored
    # as ENVIRONMENT secrets on `github-pages` (not repo secrets). Environment
    # secrets are only injected into jobs that opt into that environment, so
    # this job must declare it too — otherwise `secrets.*` resolve to empty and
    # `npx tinacms build` fails with "Missing clientId, token". (The env's
    # branch policy allows only `master`, which is the only branch this workflow
    # deploys from, so gating the build job on it is safe.)
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build TinaCMS admin SPA (-> admin/, shipped as /admin)
        run: npx tinacms build
        env:
          TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}

      - name: Build (SCSS + modal JS + Eleventy + PurgeCSS)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
